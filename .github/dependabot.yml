# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.

version: 2
updates:
#  - package-ecosystem: "pip" # See documentation for possible values
#    directory: "/services/detection" # Location of package manifests
#    schedule:
#      interval: "weekly"

  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/services/notification" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: "docker" # See documentation for possible values
    directories:
#      - "/services/detection"
      - "/services/notification"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "maven"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "docker-compose" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "supabase/postgres"
        update-types: [ "version-update:semver-major" ]
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
