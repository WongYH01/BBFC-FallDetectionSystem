name: refit

# The weekly Refit (ADR 0003). Keypoint Files are downloaded into the runner's
# temp folder, used and discarded: never uploaded as an artifact or cached,
# and no step logs an Alert's object name (ADR 0002).
#
# On a Promotion the Candidate Head is uploaded to the weights repository and
# the GitHub App opens a PR repinning it in fetch_weights.py, set to merge
# itself once `gate` is green. Secrets: FALL_WEIGHTS_TOKEN (HF read),
# HF_WRITE_TOKEN (HF write), REFIT_APP_ID and REFIT_APP_PRIVATE_KEY.

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop before uploading anything, even on a Promotion
        type: boolean
        default: true

concurrency:
  group: refit

permissions:
  contents: read
  id-token: write

jobs:
  refit:
    name: Refit the Camera Head
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/detection

    env:
      BUCKET: gs://fyp-elderly-detection-clips
      # The live rule, as services/detection/.env.example runs it
      BUFFER_LEN: '2'
      FALL_CLEAR_WINDOWS: '1'
      STREAM_FRAME_STRIDE: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The Promotion pushes as the App, since GITHUB_TOKEN's PRs trigger no CI.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/detection/requirements.txt

      - name: Install torch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0

      - name: Install requirements
        run: pip install -r requirements.txt scikit-learn==1.9.1 huggingface_hub==1.29.0  # fetch_weights.py; the Dockerfile pins it too

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Mirror the bucket
        run: |
          mirror="$RUNNER_TEMP/refit/keypoints"
          mkdir -p "$mirror"
          # keypoints/incoming is never used, so not mirrored: its count reads 0.
          # Pinned clips are named in the manifest in git, so their errors may show.
          for prefix in commissioning heldout; do
            gcloud storage rsync -r "$BUCKET/keypoints/$prefix" "$mirror/$prefix" > /dev/null
          done
          # An Alert's object name is its Event ID: withhold rsync's output.
          if gcloud storage ls "$BUCKET/keypoints/labelled/" > /dev/null 2> "$RUNNER_TEMP/ls.err"; then
            gcloud storage rsync -r "$BUCKET/keypoints/labelled" "$mirror/labelled" > /dev/null 2>&1 \
              || { echo "::error::could not mirror keypoints/labelled"; exit 1; }
          elif ! grep -q 'matched no objects' "$RUNNER_TEMP/ls.err"; then
            cat "$RUNNER_TEMP/ls.err" >&2
            exit 1
          fi
          cp refit/pinned.sha256 "$RUNNER_TEMP/refit/pinned.sha256"

      - name: Fetch the deployed weights
        env:
          FALL_WEIGHTS_TOKEN: ${{ secrets.FALL_WEIGHTS_TOKEN }}
        run: |
          printf 'FALL_WEIGHTS_TOKEN=%s\n' "$FALL_WEIGHTS_TOKEN" > "$RUNNER_TEMP/detection.env"
          python scripts/fetch_weights.py --env-file "$RUNNER_TEMP/detection.env"

      - name: Run the Refit
        id: refit
        env:
          PYTHONPATH: .
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: nothing is uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
          python scripts/run_refit.py "$RUNNER_TEMP/refit" --promote-dir "$RUNNER_TEMP/promote"

      # Schedule runs have no inputs: a null dry_run is a real run.
      # Minted first, so a broken App fails the run before anything is uploaded.
      - name: Mint the App token
        id: app
        if: steps.refit.outputs.promoted == 'true' && inputs.dry_run != true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.REFIT_APP_ID }}
          private-key: ${{ secrets.REFIT_APP_PRIVATE_KEY }}

      - name: Upload the Candidate Head
        if: steps.refit.outputs.promoted == 'true' && inputs.dry_run != true
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          PYTHONPATH: .
        run: |
          # The PR goes to main, so it must branch from main to change one file.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a Promotion runs only from main"; exit 1
          fi
          # The attempt too, so re-running a red run does not hit its branch.
          python scripts/promote_head.py "$RUNNER_TEMP/promote/head.npz" "refit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Verify the new pin
        if: steps.refit.outputs.promoted == 'true' && inputs.dry_run != true
        run: python scripts/fetch_weights.py --force --root "$RUNNER_TEMP/verify" --env-file "$RUNNER_TEMP/detection.env"

      - name: Open the Promotion PR
        if: steps.refit.outputs.promoted == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          file=services/detection/scripts/fetch_weights.py
          branch="refit/promote-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          id=$(gh api "/users/$SLUG[bot]" --jq .id)
          git config user.name "$SLUG[bot]"
          git config user.email "$id+$SLUG[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git -C "$GITHUB_WORKSPACE" add "$file"
          git commit -m "Promote the Refit's Candidate Head"
          # The PR may change the pinned revision and the head's hash, nothing else.
          numstat=$(git diff --numstat HEAD~1 HEAD)
          if [ "$numstat" != "$(printf '2\t2\t%s' "$file")" ]; then
            echo "::error::the Promotion commit changes more than the two pins: $numstat"; exit 1
          fi
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Promote the Refit's Candidate Head" \
            --body-file "$RUNNER_TEMP/promote/report.md")
          gh pr merge "$url" --auto --squash
          echo "Promotion PR: $url" >> "$GITHUB_STEP_SUMMARY"
