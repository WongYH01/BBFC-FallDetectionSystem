name: image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build-scan-push:
    name: Build image, Scan w/ Trivy, Push to GAR
    runs-on: ubuntu-latest
    env:
      LOCAL: bbfc-registry/${{ inputs.service }}:${{ github.sha }}
      REMOTE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bbfc-registry/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write build secret
        env:
          FALL_WEIGHTS_TOKEN: ${{ secrets.FALL_WEIGHTS_TOKEN }}
        run: printf 'FALL_WEIGHTS_TOKEN=%s\n' "$FALL_WEIGHTS_TOKEN" > "$RUNNER_TEMP/detection.env"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ inputs.service }}
          secret-files: detection_env=${{ runner.temp }}/detection.env
          load: true
          tags: ${{ env.LOCAL }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: services/${{ inputs.service }}
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-config.sarif'
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Trivy image scan
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-image.sarif'
          exit-code: '1'
          limit-severities-for-sarif: true
          skip-setup-trivy: true

      - name: Upload Trivy config results to GitHub Security tab
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-config.sarif'
          category: trivy-config-${{ inputs.service }}

      - name: Upload Trivy image results to GitHub Security tab
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image-${{ inputs.service }}

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v3'
        id: auth
        if: github.event_name == 'push'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Google Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$LOCAL" "$REMOTE:${{ github.sha }}"
          docker tag "$LOCAL" "$REMOTE:latest"
          docker tag "$LOCAL" "$REMOTE:main-${GITHUB_SHA::8}-$(date +%s)"
          docker push --all-tags "$REMOTE"