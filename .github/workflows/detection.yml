name: detection

on:
  workflow_call:

jobs:
  test:
    name: Lint and run detection service tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/detection

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/detection/requirements.txt

      - name: Install torch CPU
        run:  pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0

      - name: Install ruff
        run: pip install -r requirements.txt ruff==0.17.1

      - name: Lint bugs with ruff
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v