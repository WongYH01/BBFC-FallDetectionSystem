name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      detection: ${{ steps.filter.outputs.detection }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/**'
              - 'docker-compose.yml'
            detection:
              - *shared
              - 'services/detection/**'
            notification:
              - *shared
              - 'services/notification/**'


#  detection:
#    needs: changes
#    if: needs.changes.outputs.detection == 'true'
#    uses: ./.github/workflows/detection.yml


  notification:
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    uses: ./.github/workflows/notification.yml


#  detection-image:
#    needs: detection
#    uses: ./.github/workflows/image.yml
#    permissions:
#      contents: read
#      id-token: write
#    with:
#      service: detection


  notification-image:
    needs: notification
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      service: notification


  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      actions: read
      contents: read
      id-token: write


  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high


  gate:
    if: always()
#    needs: [changes, detection, notification, detection-image, notification-image, codeql, dependency-review]
    needs: [changes, notification, notification-image, codeql, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1