spring.application.name=notification
server.servlet.context-path=/api/v1/notification
server.port=8081

# Secrets come from .env locally and from real environment variables in a container.
# The same key names work either way, so nothing about the app changes between the two.
# optional: means a deployed container without the file is fine.
spring.config.import=optional:file:./.env[.properties]

telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-group-id=${TELEGRAM_CHAT_GROUP_ID}

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/postgres?currentSchema=alerts
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.schemas=alerts
spring.flyway.default-schema=alerts
spring.flyway.create-schemas=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=alerts

# Non-secret tunables live in config/application.yml, which Spring picks up from ./config
# automatically at higher precedence than this file. See config/README.md.
