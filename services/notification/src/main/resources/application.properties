spring.application.name=notification
server.servlet.context-path=/api/v1/notification
server.port=8081

spring.config.import=optional:file:./.env[.properties]

telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-group-id=${TELEGRAM_CHAT_GROUP_ID}

supabase.storage.url=http://localhost:${STORAGE_PORT:5000}
supabase.storage.service-key=${SUPABASE_SERVICE_KEY}

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/postgres?currentSchema=alerts
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.schemas=alerts
spring.flyway.default-schema=alerts
spring.flyway.create-schemas=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=alerts

# Sits deliberately above clips.max-bytes so the clean 413 comes from us, not the servlet.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=-1
