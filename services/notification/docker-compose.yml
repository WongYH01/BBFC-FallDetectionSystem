services:
  db:
    image: supabase/postgres:15.14.1.170
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/storage-role-password.sql:/docker-entrypoint-initdb.d/zz-storage-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: supabase/storage-api:v1.75.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT}
    ports:
      - "127.0.0.1:${STORAGE_PORT}:5000"
    volumes:
      - clip-data:/var/lib/storage

  notification:
    build: .
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres?currentSchema=alerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_STORAGE_URL: http://storage:5000
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_GROUP_ID: ${TELEGRAM_CHAT_GROUP_ID}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config:/app/config:ro

volumes:
  db-data: {}
  clip-data: {}