# Operator-editable settings. Nothing secret belongs in this file — it is committed.
#
# Spring picks this up from ./config automatically, at higher precedence than the
# packaged application.properties. Edit and restart; no rebuild needed. In a container
# this is bind-mounted, which is why it holds no credentials. See config/README.md.

telegram:
  base-url: https://api.telegram.org

  # Placeholders: {roomName} {time} {confidence}. An unknown one fails at
  # startup — see TemplateMessageRenderer.validateTemplate.
  message-template: "
      🚨   <b>FALL DETECTED</b>\n\n
      <b>Room</b> {roomName}\n
      <b>Time</b> {time}
  "

  # Placeholders: {roomName} {handledLine}. Sent after acknowledgement, asking
  # whether the fall was genuine. Same unknown-placeholder validation as message-template.
  triage-question-template: "
      <b>{roomName}</b>\n
      {handledLine}\n
      <b>Was this a genuine fall?</b>
  "

  # Placeholders: {ordinal} {roomName}. Sent as a keyboardless reply to the alert message on
  # each escalation; {ordinal} is the count (1st, 2nd, 3rd...). Same validation as above.
  escalation-template: "
      ⚠️ <b>{ordinal} escalation</b>\n
      {roomName}
  "

  # Receives button taps via getUpdates. Telegram allows one long-poller per bot token,
  # so a second running instance gets 409 Conflict.
  polling-enabled: true

clips:
  # Must stay below spring.servlet.multipart.max-file-size, and match the bucket's own limit
  # and STORAGE_FILE_SIZE_LIMIT so all three agree.
  max-bytes: 8388608
  # Created at startup if absent. A failure here never blocks boot.
  ensure-bucket: true

supabase:
  storage:
    bucket: skeleton-clips

alerting:
  dispatch:
    # How long a received alert is held for its skeleton clip before it goes out as text only.
    clip-wait: 20s
  escalation:
    window: 60s
    max-repeats: 3
    scheduler-enabled: true

