[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fallcore"
version = "0.1.0"
description = "YOLO26-Pose + Transformer fall detection (replication of Benabdennour et al., IEEE Access 2026)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "ultralytics>=8.4",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "opencv-python",
    "tqdm",
]

[project.optional-dependencies]
# Notebook 18: pose backbone export and CPU/ONNX benchmarking.
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[tool.setuptools]
packages = ["fallcore"]
