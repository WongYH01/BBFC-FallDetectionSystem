# Whole system: db + storage + notification + detection.
#
#   docker compose up -d --build                        local (default via COMPOSE_PROFILES in .env)
#   docker compose --env-file .env.cloud up -d --build  cloud: Cloud SQL + GCS, no db/storage
#   docker compose up -d db storage                     infra only, for running Spring from the IDE
#
# Needs .env (copy .env.example.local) and services/detection/.env (copy its
# .env.example). The detection build fetches its own weights with the
# FALL_WEIGHTS_TOKEN in that file; nothing has to be on the host.
name: bbfc

services:
  db:
    profiles: ["local"]
    image: supabase/postgres:15.14.1.170
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./services/notification/docker/storage-role-password.sql:/docker-entrypoint-initdb.d/zz-storage-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    profiles: ["local"]
    image: supabase/storage-api:v1.81.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT}
    ports:
      - "127.0.0.1:${STORAGE_PORT}:5000"
    volumes:
      - clip-data:/var/lib/storage

  notification:
    profiles: ["local", "cloud"]
    build: services/notification
    depends_on:
      db:
        condition: service_healthy
        required: false
      storage:
        condition: service_started
        required: false
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/postgres?currentSchema=alerts}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_STORAGE_URL: ${SUPABASE_STORAGE_URL:-http://storage:5000}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      CLIPS_STORE: ${CLIPS_STORE:-supabase}
      CLIPS_GCS_BUCKET: ${CLIPS_GCS_BUCKET:-}
      CLIPS_ENSURE_BUCKET: ${CLIPS_ENSURE_BUCKET:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_GROUP_ID: ${TELEGRAM_CHAT_GROUP_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /creds.json
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./services/notification/config:/app/config:ro
      - ${GCLOUD_ADC_PATH:-./services/notification/docker/adc-placeholder.json}:/creds.json:ro

  detection:
    profiles: ["local", "cloud"]
    build:
      context: services/detection
      # The build fetches the weights into the image; this hands it the
      # Hugging Face token as a secret, so it never lands in a layer.
      secrets:
        - detection_env
    image: bbfc/detection:latest
    restart: unless-stopped
    depends_on:
      # The outbox retries until the API answers, so this only saves a burst
      # of retry noise at startup; the notification image has a HEALTHCHECK.
      notification:
        condition: service_healthy
    env_file:
      - services/detection/.env
    environment:
      # Listen on all interfaces inside the container; the publish below keeps
      # the UI (which has no auth) on the host's loopback only.
      SERVICE_UI_HOST: 0.0.0.0
      SPOOL_DIR: /data/outbox
      NOTIFICATION_BASE_URL: http://notification:8081/api/v1/notification
      # Build-time only: the weights are already in the image.
      FALL_WEIGHTS_TOKEN: ""
    volumes:
      - clips:/app/v2/fall_clips
      - spool:/data/outbox
    ports:
      - "127.0.0.1:5005:5005"

volumes:
  db-data: {}
  clip-data: {}
  clips: {}
  spool: {}

secrets:
  detection_env:
    file: ./services/detection/.env
