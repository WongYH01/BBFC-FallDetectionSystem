# tells GKE to go into Google Secret Manager and fetch the secret under temp name
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: detection
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/fyp-elderly-detection/secrets/detection-stream-password/versions/latest
        path: detection-stream-password

---

apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: detection
spec:
  serviceAccountName: detection
  secretProviderClassName: detection
  secretObject:
    type: Opaque
    data:
      - sourcePath: detection-stream-password
        targetKey: STREAM_PASSWORD