apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: notification
  namespace: flux-system
spec:
  image: asia-southeast1-docker.pkg.dev/fyp-elderly-detection/bbfc-registry/notification
  interval: 5m
  provider: gcp
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: notification
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: notification
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc