apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bbfc
resources:
- namespace.yml
- notification/serviceaccount.yml
- notification/secrets.yml
- notification/deployment.yml
- notification/service.yml
- detection/serviceaccount.yml
- detection/secrets.yml
- detection/statefulset.yml
- tailscale/egress-service.yml
# newTag gets updated by flux automatically
images:
- name: notification
  newName: asia-southeast1-docker.pkg.dev/fyp-elderly-detection/bbfc-registry/notification
  newTag: main-5a051de3-1793377943 # {"$imagepolicy": "flux-system:notification:tag"}
- name: detection
  newName: asia-southeast1-docker.pkg.dev/fyp-elderly-detection/bbfc-registry/detection
  newTag: main-eaf63e00-1793368908 # {"$imagepolicy": "flux-system:detection:tag"}
