apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bbfc
resources:
- namespace.yml
- notification/serviceaccount.yml
- notification/secrets.yml
- notification/deployment.yml
- notification/service.yml
- detection/serviceaccount.yml
- detection/secrets.yml
- detection/statefulset.yml
- tailscale/egress-service.yml

configMapGenerator:

- envs:
