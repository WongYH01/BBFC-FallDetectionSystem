# tells GKE to go into Google Secret Manager and fetch the secret under temp name
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notification
  namespace: bbfc
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/fyp-elderly-detection/secrets/telegram-bot-token/versions/latest
        path: telegram-bot-token

---

# tells GKE to take the secret fetched, verify that it has the credentials then turn it into K8s secret var
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: notification
  namespace: bbfc
spec:
  serviceAccountName: notification
  secretProviderClassName: notification
  secretObject:
    type: Opaque
    data:
      - sourcePath: telegram-bot-token
        targetKey: TELEGRAM_BOT_TOKEN